<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Marry Me 💍</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      text-align: center;
      font-family: Arial, sans-serif;

      background: url('cat.jpg') no-repeat center center/cover;
      height: 100vh;
      overflow: hidden;
      color: white;
    }

    .overlay {
      background: rgba(0,0,0,0.4);
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 45px;
      margin-bottom: 30px;
    }

    .btn {
      padding: 15px 30px;
      font-size: 18px;
      margin: 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #yes {
      background-color: #28a745;
      color: white;
    }

    #no {
      background-color: #dc3545;
      color: white;
      position: absolute;
    }
  </style>
</head>

<body>

  <div class="overlay">
    <h1>Will you marry me? 💍🐱</h1>

    <button id="yes" class="btn" onclick="yesClick()">Yes 💖</button>
    <button id="no" class="btn">No 💔</button>
  </div>

  <script>
    const noBtn = document.getElementById("no");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    function yesClick() {
      alert("I knew it 😍💍");
    }
  </script>

</body>
</html>
