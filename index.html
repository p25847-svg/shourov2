<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Love Proposal 😍</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      margin-top: 80px;
      background: linear-gradient(135deg, #ffb6c1, #ffc0cb, #ff99cc);
      overflow: hidden;
    }

    h1 {
      font-size: 45px;
      color: #ff0066;
    }

    .cats {
      font-size: 30px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 15px 30px;
      font-size: 18px;
      margin: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #accept {
      background-color: #4CAF50;
      color: white;
    }

    #reject {
      background-color: #ff3333;
      color: white;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="cats">🐱🐱🐱 🐾 🐱🐱</div>

  <h1>I love you ghelu 💖</h1>

  <button id="accept" class="btn" onclick="acceptLove()">Accept 💖</button>
  <button id="reject" class="btn">Reject 💔</button>

  <script>
    const rejectBtn = document.getElementById("reject");

    rejectBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);

      rejectBtn.style.left = x + "px";
      rejectBtn.style.top = y + "px";
    });

    function acceptLove() {
      alert("Aww ghelu 😍💕");
    }
  </script>

</body>
</html>
